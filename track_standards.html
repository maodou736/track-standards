<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>淘宝直播内容化赛道标准</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; background: #f5f5f5; color: #333; font-size: 14px; line-height: 1.6; }

/* 头部 */
.header { background: #ff5000; color: #fff; padding: 20px; text-align: center; }
.header h1 { font-size: 22px; font-weight: 600; }
.header .subtitle { font-size: 13px; opacity: 0.9; margin-top: 4px; }

.container { max-width: 1200px; margin: 0 auto; padding: 16px; }

/* 筛选卡片 */
.filter-card { background: #fff; border-radius: 8px; padding: 16px 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
.filter-group { display: flex; flex-direction: column; gap: 4px; }
.filter-group label { font-size: 12px; color: #666; font-weight: 500; }
.filter-group select, .filter-group input { padding: 7px 10px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 13px; min-width: 110px; outline: none; background: #fff; }
.filter-group input { min-width: 180px; }

.coef-filter { display: flex; gap: 5px; flex-wrap: wrap; }
.coef-btn { padding: 5px 12px; border-radius: 16px; border: 1px solid #e0e0e0; background: #fff; font-size: 12px; cursor: pointer; font-weight: 500; }
.coef-btn:hover { border-color: #ff5000; }
.coef-btn.active { color: #fff; background: #ff5000; border-color: #ff5000; }
.coef-btn.c2 { color: #f5222d; border-color: #ffccc7; background: #fff1f0; }
.coef-btn.c2.active { background: #f5222d; color: #fff; }
.coef-btn.c15 { color: #fa8c16; border-color: #ffd8bf; background: #fff7e6; }
.coef-btn.c15.active { background: #fa8c16; color: #fff; }
.coef-btn.c1 { color: #1890ff; border-color: #bae7ff; background: #e6f7ff; }
.coef-btn.c1.active { background: #1890ff; color: #fff; }
.coef-btn.c05 { color: #666; border-color: #d9d9d9; background: #fafafa; }
.coef-btn.c05.active { background: #8c8c8c; color: #fff; }
.coef-btn.c0 { color: #999; border-color: #e8e8e8; background: #f5f5f5; }
.coef-btn.c0.active { background: #bfbfbf; color: #fff; }

.stats { font-size: 13px; color: #666; margin-left: auto; padding-bottom: 2px; }
.stats span { color: #ff5000; font-weight: 600; }

/* 表格 */
.table-card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th { padding: 12px 14px; text-align: left; font-size: 13px; font-weight: 600; color: #666; border-bottom: 1px solid #f0f0f0; background: #fafafa; white-space: nowrap; }
td { padding: 10px 14px; border-bottom: 1px solid #f5f5f5; font-size: 13px; vertical-align: middle; }
tbody tr { transition: background 0.1s; }
tbody tr:nth-child(even) { background: #fafafa; }
tbody tr:hover { background: #fff5f0; cursor: pointer; }

.track-name { display: flex; align-items: center; gap: 8px; font-weight: 500; color: #333; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #ff5000; flex-shrink: 0; }
.dot.has-data { background: #52c41a; }

.type-pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 500; }
.type-pill.ent { background: #e6f4ff; color: #0958d9; }
.type-pill.seed { background: #f6ffed; color: #389e0d; }
.type-pill.unknown { background: #f5f5f5; color: #999; }

.stars { font-size: 14px; letter-spacing: 1px; }
.stars .gold { color: #faad14; }
.stars .orange { color: #fa8c16; }
.stars .blue { color: #1890ff; }
.stars .gray { color: #bfbfbf; }
.stars .light { color: #d9d9d9; }

.coef-pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
.coef-pill.c2 { background: #fff1f0; color: #cf1322; }
.coef-pill.c15 { background: #fff7e6; color: #d46b08; }
.coef-pill.c1 { background: #e6f7ff; color: #096dd9; }
.coef-pill.c05 { background: #f5f5f5; color: #595959; }
.coef-pill.c0 { background: #fafafa; color: #8c8c8c; }

.count { font-weight: 600; color: #333; }
.count.zero { color: #bfbfbf; font-weight: 400; }

.status { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 10px; }
.status.ok { background: #f6ffed; color: #389e0d; }
.status.no { background: #f5f5f5; color: #8c8c8c; }

/* 查看标准链接 */
.view-link { display: inline-block; padding: 3px 10px; border-radius: 10px; background: #fff5f0; color: #ff5000; font-size: 12px; font-weight: 500; text-decoration: none; border: 1px solid #ffccc7; transition: all 0.2s; }
.view-link:hover { background: #ff5000; color: #fff; }

/* 分页 */
.pagination { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 16px; background: #fff; border-top: 1px solid #f5f5f5; }
.pagination button { padding: 6px 14px; border: 1px solid #e0e0e0; background: #fff; border-radius: 6px; font-size: 13px; cursor: pointer; color: #333; }
.pagination button:hover { border-color: #ff5000; color: #ff5000; }
.pagination button:disabled { opacity: 0.4; cursor: not-allowed; border-color: #e0e0e0; color: #999; }
.pagination button.active { background: #ff5000; color: #fff; border-color: #ff5000; }
.pagination .page-info { font-size: 13px; color: #666; }

/* 模态框 */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
.modal-overlay.active { display: flex; }
.modal { background: #fff; border-radius: 12px; width: 100%; max-width: 700px; max-height: 85vh; box-shadow: 0 10px 40px rgba(0,0,0,0.15); display: flex; flex-direction: column; overflow: hidden; }
.modal-header { padding: 16px 20px 12px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
.modal-header h2 { font-size: 17px; font-weight: 600; color: #333; }
.modal-close { width: 32px; height: 32px; border-radius: 50%; border: none; background: #f5f5f5; color: #666; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.modal-close:hover { background: #ff5000; color: #fff; }

.modal-tabs { display: flex; gap: 0; padding: 0 20px; border-bottom: 1px solid #f0f0f0; }
.modal-tab { padding: 10px 16px; font-size: 14px; font-weight: 500; color: #666; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; background: none; border: none; outline: none; margin-bottom: -1px; }
.modal-tab.active { color: #ff5000; border-bottom-color: #ff5000; }
.modal-tab:hover { color: #ff5000; }

.modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; }
.modal-body::-webkit-scrollbar { width: 6px; }
.modal-body::-webkit-scrollbar-thumb { background: #d9d9d9; border-radius: 3px; }

.std-card { background: #fafafa; border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; border-left: 3px solid; }
.std-card.l3 { border-left-color: #1890ff; }
.std-card.l4 { border-left-color: #52c41a; }
.std-card p { color: #333; font-size: 13px; line-height: 1.7; }
.std-card .idx { color: #999; font-size: 12px; margin-right: 6px; font-weight: 500; }
.no-std { text-align: center; color: #999; padding: 30px 0; font-size: 13px; }

@media (max-width: 768px) {
    .filter-card { flex-direction: column; align-items: stretch; }
    .stats { margin-left: 0; margin-top: 4px; }
    th, td { padding: 8px 10px; font-size: 12px; }
}
</style>
</head>
<body>
<div class="header">
    <h1>淘宝直播内容化赛道标准</h1>
    <div class="subtitle">内容化等级考核标准 · 系数与星级查询工具</div>
</div>
<div class="container">
    <!-- 筛选区 -->
    <div class="filter-card">
        <div class="filter-group">
            <label>类型筛选</label>
            <select id="filterType">
                <option value="all">全部类型</option>
                <option value="娱乐">娱乐</option>
                <option value="种草">种草</option>
                <option value="未知">未知</option>
            </select>
        </div>
        <div class="filter-group">
            <label>星级筛选</label>
            <select id="filterStar">
                <option value="all">全部星级</option>
                <option value="5">5星</option>
                <option value="4">4星</option>
                <option value="3">3星</option>
                <option value="2">2星</option>
                <option value="0">0星</option>
            </select>
        </div>
        <div class="filter-group">
            <label>系数筛选</label>
            <div class="coef-filter" id="coefFilter">
                <button class="coef-btn all active" data-coef="all">全部</button>
                <button class="coef-btn c2" data-coef="2.0">2.0x</button>
                <button class="coef-btn c15" data-coef="1.5">1.5x</button>
                <button class="coef-btn c1" data-coef="1.0">1.0x</button>
                <button class="coef-btn c05" data-coef="0.5">0.5x</button>
                <button class="coef-btn c0" data-coef="0">0</button>
            </div>
        </div>
        <div class="filter-group">
            <label>搜索赛道</label>
            <input type="text" id="searchInput" placeholder="输入赛道名称搜索...">
        </div>
        <div class="stats" id="stats">共 <span>250</span> 个赛道</div>
    </div>

    <!-- 表格 -->
    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th>赛道名称</th>
                    <th>类型</th>
                    <th>星级</th>
                    <th>系数</th>
                    <th>3级标准</th>
                    <th>4级标准</th>
                    <th>状态</th>
                    <th>查看标准</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
        <!-- 分页 -->
        <div class="pagination" id="pagination"></div>
    </div>
</div>

<!-- 模态框 -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
        <div class="modal-header">
            <h2 id="modalTitle">赛道名称</h2>
            <button class="modal-close" id="modalClose">&times;</button>
        </div>
        <div class="modal-tabs">
            <button class="modal-tab active" data-tab="l3">3级标准 (<span id="l3Count">0</span>)</button>
            <button class="modal-tab" data-tab="l4">4级标准 (<span id="l4Count">0</span>)</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<!-- 加载数据 -->
<script src="track_standards_base.js"></script>
<script src="track_standards_detail.js"></script>

<script>
const PAGE_SIZE = 50;
let currentPage = 1;
let filteredData = [];
let currentFilter = { type: 'all', star: 'all', coef: 'all', search: '' };
let currentTab = 'l3';
let currentTrack = null;
let searchTimeout = null;

function getStarClass(star) {
    if (star === '★★★★★') return 'gold';
    if (star === '★★★★') return 'orange';
    if (star === '★★★') return 'blue';
    if (star === '★★') return 'gray';
    return 'light';
}

function renderStars(star) {
    const n = star.length;
    const cls = getStarClass(star);
    let h = '<span class="stars">';
    for (let i = 0; i < 5; i++) {
        h += i < n ? '<span class="' + cls + '">★</span>' : '<span class="light">★</span>';
    }
    h += '</span>';
    return h;
}

function getCoefClass(coef) {
    if (coef >= 2.0) return 'c2';
    if (coef >= 1.5) return 'c15';
    if (coef >= 1.0) return 'c1';
    if (coef >= 0.5) return 'c05';
    return 'c0';
}

function getTypeClass(t) {
    if (t === '娱乐') return 'ent';
    if (t === '种草') return 'seed';
    return 'unknown';
}

function getStarValue(star) {
    return star.length;
}

function filterData() {
    filteredData = trackBaseData.filter(t => {
        if (currentFilter.type !== 'all' && t.type !== currentFilter.type) return false;
        if (currentFilter.star !== 'all') {
            const sv = getStarValue(t.star_rating);
            if (sv.toString() !== currentFilter.star) return false;
        }
        if (currentFilter.coef !== 'all') {
            const c = parseFloat(currentFilter.coef);
            if (c === 0) return t.coefficient === 0;
            return t.coefficient === c;
        }
        if (currentFilter.search) {
            return t.name.toLowerCase().includes(currentFilter.search.toLowerCase());
        }
        return true;
    });
    currentPage = 1;
    renderTable();
    renderPagination();
    document.getElementById('stats').innerHTML = '共 <span>' + filteredData.length + '</span> 个赛道';
}

function renderTable() {
    const tbody = document.getElementById('tableBody');
    const start = (currentPage - 1) * PAGE_SIZE;
    const pageData = filteredData.slice(start, start + PAGE_SIZE);

    if (pageData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#999;padding:40px;">未找到符合条件的赛道</td></tr>';
        return;
    }

    const fragment = document.createDocumentFragment();
    for (const t of pageData) {
        const tr = document.createElement('tr');
        tr.dataset.track = t.name;
        const typeCls = getTypeClass(t.type);
        const coefCls = getCoefClass(t.coefficient);
        const hasData = t.has_data;
        const statusHtml = hasData
            ? '<span class="status ok"><span style="width:6px;height:6px;border-radius:50%;background:#52c41a;display:inline-block;"></span>有数据</span>'
            : '<span class="status no">暂无</span>';
        const dotCls = hasData ? 'dot has-data' : 'dot';
        const l3Cls = t.level3_count > 0 ? 'count' : 'count zero';
        const l4Cls = t.level4_count > 0 ? 'count' : 'count zero';

        const viewHtml = t.url 
            ? '<a href="' + t.url + '" target="_blank" class="view-link" onclick="event.stopPropagation();">查看标准</a>' 
            : '<span style="color:#bfbfbf;font-size:12px;">暂缺</span>';

        tr.innerHTML = '<td><div class="track-name"><span class="' + dotCls + '"></span>' + t.name + '</div></td>' +
            '<td><span class="type-pill ' + typeCls + '">' + t.type + '</span></td>' +
            '<td>' + renderStars(t.star_rating) + '</td>' +
            '<td><span class="coef-pill ' + coefCls + '">' + t.coefficient_str + '</span></td>' +
            '<td><span class="' + l3Cls + '">' + t.level3_count + ' 条</span></td>' +
            '<td><span class="' + l4Cls + '">' + t.level4_count + ' 条</span></td>' +
            '<td>' + statusHtml + '</td>' +
            '<td>' + viewHtml + '</td>';
        fragment.appendChild(tr);
    }
    tbody.innerHTML = '';
    tbody.appendChild(fragment);
}

function renderPagination() {
    const total = filteredData.length;
    const totalPages = Math.ceil(total / PAGE_SIZE) || 1;
    const el = document.getElementById('pagination');
    if (totalPages <= 1) { el.innerHTML = ''; return; }

    let h = '<button ' + (currentPage === 1 ? 'disabled' : '') + ' onclick="goPage(' + (currentPage - 1) + ')">上一页</button>';
    const maxButtons = 5;
    let start = Math.max(1, currentPage - Math.floor(maxButtons / 2));
    let end = Math.min(totalPages, start + maxButtons - 1);
    if (end - start + 1 < maxButtons) start = Math.max(1, end - maxButtons + 1);

    for (let i = start; i <= end; i++) {
        h += '<button class="' + (i === currentPage ? 'active' : '') + '" onclick="goPage(' + i + ')">' + i + '</button>';
    }
    h += '<button ' + (currentPage === totalPages ? 'disabled' : '') + ' onclick="goPage(' + (currentPage + 1) + ')">下一页</button>';
    h += '<span class="page-info">第 ' + currentPage + ' / ' + totalPages + ' 页</span>';
    el.innerHTML = h;
}

function goPage(p) {
    const totalPages = Math.ceil(filteredData.length / PAGE_SIZE) || 1;
    if (p < 1 || p > totalPages) return;
    currentPage = p;
    renderTable();
    renderPagination();
}

function showModal(trackName) {
    const track = trackBaseData.find(t => t.name === trackName);
    if (!track) return;
    currentTrack = track;
    document.getElementById('modalTitle').textContent = track.name;
    document.getElementById('l3Count').textContent = track.level3_count;
    document.getElementById('l4Count').textContent = track.level4_count;
    currentTab = 'l3';
    updateTabs();
    renderModalBody();
    document.getElementById('modalOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    document.body.style.overflow = '';
}

function updateTabs() {
    document.querySelectorAll('.modal-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === currentTab);
    });
}

function renderModalBody() {
    const body = document.getElementById('modalBody');
    if (!currentTrack) return;
    const detail = trackDetailData[currentTrack.name];
    const items = detail ? (currentTab === 'l3' ? detail.level3 : detail.level4) : [];
    const prefix = currentTab === 'l3' ? '3' : '4';
    const borderCls = currentTab === 'l3' ? 'l3' : 'l4';

    if (!items || items.length === 0) {
        body.innerHTML = '<div class="no-std">暂无' + prefix + '级标准数据</div>';
        return;
    }

    let h = '';
    for (let i = 0; i < items.length; i++) {
        h += '<div class="std-card ' + borderCls + '"><p><span class="idx">' + (i + 1) + '.</span>' + items[i] + '</p></div>';
    }
    body.innerHTML = h;
}

// 事件监听
document.getElementById('filterType').addEventListener('change', function() {
    currentFilter.type = this.value;
    filterData();
});

document.getElementById('filterStar').addEventListener('change', function() {
    currentFilter.star = this.value;
    filterData();
});

document.getElementById('searchInput').addEventListener('input', function() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        currentFilter.search = this.value;
        filterData();
    }, 300);
});

document.getElementById('coefFilter').addEventListener('click', function(e) {
    if (e.target.classList.contains('coef-btn')) {
        this.querySelectorAll('.coef-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter.coef = e.target.dataset.coef;
        filterData();
    }
});

document.getElementById('tableBody').addEventListener('click', function(e) {
    const tr = e.target.closest('tr[data-track]');
    if (tr) showModal(tr.dataset.track);
});

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

document.querySelectorAll('.modal-tab').forEach(btn => {
    btn.addEventListener('click', function() {
        currentTab = this.dataset.tab;
        updateTabs();
        renderModalBody();
    });
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
});

// 初始化
filterData();
</script>
</body>
</html>
